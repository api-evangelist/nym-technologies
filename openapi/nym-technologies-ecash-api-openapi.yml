  /v1/ecash/partial-coin-indices-signatures:
    get:
      tags:
      - Ecash
      operationId: partial_coin_indices_signatures
      parameters:
      - name: epoch_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: output
        in: query
