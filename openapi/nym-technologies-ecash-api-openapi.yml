    post:
      tags:
      - Ecash
      operationId: verify_ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEcashTicketBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcashTicketVerificationResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EcashTicketVerificationResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/EcashTicketVerificationResponse'
        '400':
          description: this nym-api is not an ecash signer in the current epoch
