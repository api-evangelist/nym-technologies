        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedMessage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/SignedMessage'
            application/bincode:
              schema:
                $ref: '#/components/schemas/SignedMessage'
        '400':
          description: this nym-api is not an ecash signer in the current epoch
          content:
            text/plain:
              schema:
                type: string
  /v1/ecash/issued-ticketbooks-count:
    get:
      tags:
      - Ecash
      summary: 'Returns number of issued ticketbooks for given dates.

        Note: this endpoint will not be accurate for old dates'
      operationId: issued_ticketbooks_count
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTicketbooksCountResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/IssuedTicketbooksCountResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/IssuedTicketbooksCountResponse'
        '400':
          description: this nym-api is not an ecash signer in the current epoch
          content:
            text/plain:
              schema:
                type: string
  /v1/ecash/issued-ticketbooks-data:
