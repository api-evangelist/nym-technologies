                $ref: '#/components/schemas/EcashBatchTicketRedemptionResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/EcashBatchTicketRedemptionResponse'
        '400':
          description: this nym-api is not an ecash signer in the current epoch
