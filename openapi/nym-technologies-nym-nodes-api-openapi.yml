openapi: 3.1.0
info:
  title: Node Status API Status Nym Nodes API
  description: ''
  contact:
    name: Nym Technologies SA
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 4.6.2
tags:
- name: Nym Nodes
paths:
  /v1/nym-nodes/annotation/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: get_node_annotation
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Output'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationResponseV1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AnnotationResponseV1'
            application/bincode:
              schema:
                $ref: '#/components/schemas/AnnotationResponseV1'
  /v1/nym-nodes/bonded:
    get:
      tags:
      - Nym Nodes
      operationId: get_bonded_nodes
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDetails'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDetails'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDetails'
  /v1/nym-nodes/described:
    get:
      tags:
      - Nym Nodes
      operationId: get_described_nodes
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDescriptionV1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDescriptionV1'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDescriptionV1'
      deprecated: true
  /v1/nym-nodes/historical-performance/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: get_historical_performance
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDatePerformanceResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/NodeDatePerformanceResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/NodeDatePerformanceResponse'
  /v1/nym-nodes/noise:
    get:
      tags:
      - Nym Nodes
      operationId: nodes_noise
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NoiseDetails'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NoiseDetails'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NoiseDetails'
  /v1/nym-nodes/performance-history/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: get_node_performance_history
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceHistoryResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PerformanceHistoryResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PerformanceHistoryResponse'
  /v1/nym-nodes/performance/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: get_current_node_performance
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Output'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePerformanceResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/NodePerformanceResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/NodePerformanceResponse'
  /v1/nym-nodes/refresh-described:
    post:
      tags:
      - Nym Nodes
      operationId: refresh_described
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRefreshBody'
        required: true
      responses: {}
  /v1/nym-nodes/rewarded-set:
    get:
      tags:
      - Nym Nodes
      operationId: rewarded_set
      parameters:
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Output'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardedSetResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RewardedSetResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/RewardedSetResponse'
  /v1/nym-nodes/stake-saturation/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: get_node_stake_saturation
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Output'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeSaturationResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/StakeSaturationResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/StakeSaturationResponse'
  /v1/nym-nodes/uptime-history/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: get_node_uptime_history
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceHistoryResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PerformanceHistoryResponse'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PerformanceHistoryResponse'
  /v2/nym-nodes/annotation/{node_id}:
    get:
      tags:
      - Nym Nodes
      operationId: v2_get_node_annotation
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/u32'
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OutputV2'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationResponseV2'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AnnotationResponseV2'
  /v2/nym-nodes/described:
    get:
      tags:
      - Nym Nodes
      operationId: v2_get_described_nodes
      parameters:
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDescriptionV2'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDescriptionV2'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_NymNodeDescriptionV2'
  /v3/nym-nodes/stress-testing/batch-submit:
    post:
      tags:
      - Nym Nodes
      summary: Accept a batch of stress-test results from an authorised network monitor orchestrator.
      description: "The batch is rejected unless all of the following hold:\n- the submission timestamp is within a short staleness window of the current time,\n- the signer's key is currently registered in the network-monitors contract,\n- the submission timestamp is strictly greater than the signer's previous accepted submission\n  (timestamp-based replay protection, so orchestrators don't need to keep a nonce counter),\n- the signature on the body verifies against the signer's key.\n\nIndividual result entries that fail per-entry validation (non-mixnode role, performance score\noutside `[0.0, 1.0]`) are logged as errors and dropped, but do not fail the batch."
      operationId: batch_submit_stress_testing_results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedMessage'
        required: true
      responses:
        '200':
          description: the submitted batch has been accepted and stored
        '400':
          description: the submitted request is stale or replayed
        '401':
          description: the submitted request was unauthorised or failed integrity check
  /v3/nym-nodes/stress-testing/known-monitors/{identity_key}:
    get:
      tags:
      - Nym Nodes
      summary: 'Report whether the given identity key is currently recognised by this nym-api as an

        authorised network monitor orchestrator.'
      description: 'Intended for orchestrators to self-check after (re)announcing their key on-chain - a

        successful response with `authorised: true` means this nym-api has picked up the chain change

        and is ready to accept stress-test submissions signed by that key.'
      operationId: known_network_monitor
      parameters:
      - name: identity_key
        in: path
        description: base58-encoded ed25519 identity key of the queried network monitor
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnownNetworkMonitorResponse'
        '400':
          description: the provided identity key is not a valid base58-encoded ed25519 public key
components:
  schemas:
    NodeAnnotationV2:
      type: object
      required:
      - detailed_performance
      properties:
        chain_interaction_capabilities:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChainInteractionCapabilitiesDetailed'
        current_role:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DisplayRole'
        detailed_performance:
          $ref: '#/components/schemas/DetailedNodePerformanceV2'
    HostKeysV1:
      type: object
      required:
      - ed25519
      - x25519
      - current_x25519_sphinx_key
      properties:
        current_x25519_sphinx_key:
          $ref: '#/components/schemas/SphinxKeyV1'
        ed25519:
          type: string
        pre_announced_x25519_sphinx_key:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SphinxKeyV1'
        x25519:
          type: string
          deprecated: true
        x25519_versioned_noise:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VersionedNoiseKeyV1'
    NymNode:
      type: object
      description: Information provided by the node operator during bonding that are used to allow other entities to use the services of this node.
      required:
      - host
      - identity_key
      properties:
        custom_http_port:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Allow specifying custom port for accessing the http, and thus self-described, api

            of this node for the capabilities discovery.'
          minimum: 0
        host:
          type: string
          description: 'Network address of this nym-node, for example 1.1.1.1 or foo.mixnode.com

            that is used to discover other capabilities of this node.'
        identity_key:
          type: string
          description: Base58-encoded ed25519 EdDSA public key.
    AnnotationResponseV1:
      type: object
      required:
      - node_id
      properties:
        annotation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeAnnotationV1'
        node_id:
          type: integer
          format: int32
          minimum: 0
    NodeRefreshBody:
      type: object
      required:
      - node_identity
      - request_timestamp
      - signature
      properties:
        node_identity:
          type: string
        request_timestamp:
          type: integer
          format: int64
        signature:
          type: string
    BlockInfo:
      type: object
      required:
      - block_id
      - block
      properties:
        block:
          $ref: '#/components/schemas/FullBlockInfo'
        block_id:
          $ref: '#/components/schemas/BlockId'
    NodeCostParams:
      type: object
      description: 'The cost parameters, or the cost function, defined for the particular mixnode that influences

        how the rewards should be split between the node operator and its delegators.'
      required:
      - profit_margin_percent
      - interval_operating_cost
      properties:
        interval_operating_cost:
          $ref: '#/components/schemas/CoinSchema'
          description: Operating cost of the associated node per the entire interval.
        profit_margin_percent:
          type: string
          description: The profit margin of the associated node, i.e. the desired percent of the reward to be distributed to the operator.
    DetailedNodePerformanceV1:
      type: object
      required:
      - performance_score
      - routing_score
      - config_score
      properties:
        config_score:
          $ref: '#/components/schemas/ConfigScoreV1'
        performance_score:
          type: number
          format: double
          description: routing_score * config_score
        routing_score:
          $ref: '#/components/schemas/RoutingScore'
    NymNodeAuxiliaryDetailsV1:
      type: object
      properties:
        accepted_operator_terms_and_conditions:
          type: boolean
          description: 'Specifies whether this node operator has agreed to the terms and conditions

            as defined at <https://nymtech.net/terms-and-conditions/operators/v1.0.0>'
        announce_ports:
          $ref: '#/components/schemas/AnnouncePortsV1'
        location:
          type:
          - string
          - 'null'
          description: Optional ISO 3166 alpha-2 two-letter country code of the node's **physical** location
          example: PL
    NodeDatePerformanceResponse:
      type: object
      required:
      - node_id
      - date
      properties:
        date:
          type: string
          example: '1970-01-01'
        node_id:
          type: integer
          format: int32
          minimum: 0
        performance:
          type:
          - number
          - 'null'
          format: double
    AbciInfo:
      type: object
      required:
      - data
      - version
      - app_version
      - last_block_height
      - last_block_app_hash
      properties:
        app_version:
          type: integer
          format: int64
          description: The application protocol version.
          minimum: 0
        data:
          type: string
          description: Some arbitrary information.
        last_block_app_hash:
          type: string
          description: The latest result of [`Commit`].
        last_block_height:
          type: integer
          format: int64
          description: The latest block for which the app has called [`Commit`].
          minimum: 0
        version:
          type: string
          description: The application software semantic version.
    PaginatedResponse_HistoricalPerformanceResponse:
      type: object
      required:
      - pagination
      - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - date
            - performance
            properties:
              date:
                type: string
                example: '1970-01-01'
              performance:
                type: number
                format: double
        pagination:
          $ref: '#/components/schemas/Pagination'
    AuthenticatorDetailsV1:
      type: object
      required:
      - address
      properties:
        address:
          type: string
          description: address of the embedded authenticator
    OffsetDateTimeJsonSchemaWrapper:
      type: string
      format: date-time
    HostInformationV1:
      type: object
      required:
      - ip_address
      - keys
      properties:
        hostname:
          type:
          - string
          - 'null'
        ip_address:
          type: array
          items:
            type: string
        keys:
          $ref: '#/components/schemas/HostKeysV1'
    PaginatedResponse_NoiseDetails:
      type: object
      required:
      - pagination
      - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - key
            - mixnet_port
            - ip_addresses
            properties:
              ip_addresses:
                type: array
                items:
                  type: string
              key:
                $ref: '#/components/schemas/VersionedNoiseKeyV1'
              mixnet_port:
                type: integer
                format: int32
                minimum: 0
        pagination:
          $ref: '#/components/schemas/Pagination'
    VersionedNoiseKeyV1:
      type: object
      required:
      - supported_version
      - x25519_pubkey
      properties:
        supported_version:
          type: integer
          format: int32
          minimum: 0
        x25519_pubkey:
          type: string
    DescribedNodeTypeV1:
      type: string
      enum:
      - legacy_mixnode
      - legacy_gateway
      - nym_node
    NymNodeDataV2:
      type: object
      required:
      - host_information
      - build_information
      - mixnet_websockets
      properties:
        authenticator:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuthenticatorDetailsV1'
        auxiliary_details:
          $ref: '#/components/schemas/NymNodeAuxiliaryDetailsV1'
        build_information:
          $ref: '#/components/schemas/BinaryBuildInformationOwned'
        declared_role:
          $ref: '#/components/schemas/DeclaredRolesV1'
        host_information:
          $ref: '#/components/schemas/HostInformationV1'
        ip_packet_router:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IpPacketRouterDetailsV1'
        last_polled:
          $ref: '#/components/schemas/OffsetDateTimeJsonSchemaWrapper'
        lewes_protocol:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LewesProtocolDetailsV1'
        mixnet_websockets:
          $ref: '#/components/schemas/WebSocketsV1'
        network_requester:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NetworkRequesterDetailsV1'
        wireguard:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WireguardDetailsV1'
    PartSetHeader:
      type: object
      description: Block parts header
      required:
      - total
      - hash
      properties:
        hash:
          type: string
          description: Hash of the parts set header,
        total:
          type: integer
          format: int32
          description: Number of parts in this block
          minimum: 0
    LewesProtocolDetailsDataV1:
      type: object
      required:
      - enabled
      - control_port
      - data_port
      - x25519
      - kem_keys
      properties:
        control_port:
          type: integer
          format: int32
          description: 'LP TCP control address (default: 41264) for establishing LP sessions'
          minimum: 0
        data_port:
          type: integer
          format: int32
          description: 'LP UDP data address (default: 51264) for Sphinx packets wrapped in LP'
          minimum: 0
        enabled:
          type: boolean
          description: 'Helper field that specifies whether the LP listener(s) is enabled on this node.

            It is directly controlled by the node''s role (i.e. it is enabled if it supports ''entry'' mode)'
        kem_keys:
          type: object
          description: 'Digests of the KEM keys available to this node alongside hashing algorithms used

            for their computation.

            note: digests are hex encoded'
          additionalProperties:
            type: object
            additionalProperties:
              type: string
            propertyNames:
              type: string
              enum:
              - blake3
              - shake128
              - shake256
              - sha256
          propertyNames:
            type: string
            enum:
            - mlkem768
            - mceliece
        x25519:
          type: string
          description: LP public key
    HeaderVersion:
      type: object
      description: '`Version` contains the protocol version for the blockchain and the

        application.


        <https://github.com/tendermint/spec/blob/d46cd7f573a2c6a2399fcab2cde981330aa63f37/spec/core/data_structures.md#version>'
      required:
      - block
      - app
      properties:
        app:
          type: integer
          format: int64
          description: App version
          minimum: 0
        block:
          type: integer
          format: int64
          description: Block version
          minimum: 0
    DetailedNodePerformanceV2:
      type: object
      required:
      - performance_score
      - routing_score
      - config_score
      - stress_testing_score
      properties:
        config_score:
          $ref: '#/components/schemas/ConfigScoreV2'
        performance_score:
          type: number
          format: double
          description: 'routing_score * config_score

            or

            routing_score * config_score * stress_testing_score, if enabled'
        routing_score:
          $ref: '#/components/schemas/RoutingScore'
        stress_testing_score:
          $ref: '#/components/schemas/StressTestingScore'
    PerformanceHistoryResponse:
      type: object
      required:
      - node_id
      - history
      properties:
        history:
          $ref: '#/components/schemas/PaginatedResponse_HistoricalPerformanceResponse'
        node_id:
          type: integer
          format: int32
          minimum: 0
    NetworkRequesterDetailsV1:
      type: object
      required:
      - address
      - uses_exit_policy
      properties:
        address:
          type: string
          description: address of the embedded network requester
        uses_exit_policy:
          type: boolean
          description: flag indicating whether this network requester uses the exit policy rather than the deprecated allow list
    StakeSaturationResponse:
      type: object
      required:
      - saturation
      - uncapped_saturation
      - as_at
      properties:
        as_at:
          type: integer
          format: int64
        saturation:
          type: string
        uncapped_saturation:
          type: string
    RewardedSetResponse:
      type: object
      required:
      - entry_gateways
      - exit_gateways
      - layer1
      - layer2
      - layer3
      - standby
      properties:
        entry_gateways:
          type: array
          items:
