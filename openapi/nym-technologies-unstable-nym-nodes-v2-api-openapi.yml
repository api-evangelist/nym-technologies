openapi: 3.1.0
info:
  title: Node Status API Status Unstable Nym Nodes v2 API
  description: ''
  contact:
    name: Nym Technologies SA
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 4.6.2
tags:
- name: Unstable Nym Nodes v2
paths:
  /v2/unstable/nym-nodes/semi-skimmed:
    get:
      tags:
      - Unstable Nym Nodes v2
      summary: 'Return all Nym Nodes and optionally legacy mixnodes/gateways (if `no-legacy` flag is not used)

        that are currently bonded.'
      operationId: v2_nodes_expanded
      parameters:
      - name: role
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - type: string
            enum:
            - active-mixnode
            - entry-gateway
            - exit-gateway
      - name: semver_compatibility
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: no_legacy
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: epoch_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Output'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCachedNodesExpandedV2ResponseSchema'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PaginatedCachedNodesExpandedV2ResponseSchema'
            application/bincode:
              schema:
                $ref: '#/components/schemas/PaginatedCachedNodesExpandedV2ResponseSchema'
  /v2/unstable/nym-nodes/skimmed:
    get:
      tags:
      - Unstable Nym Nodes v2
      summary: 'Return all Nym Nodes and optionally legacy mixnodes/gateways (if `no-legacy` flag is not used)

        that are currently bonded.'
      operationId: v2_nodes_basic_all
      parameters:
      - name: role
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - type: string
            enum:
            - active-mixnode
            - entry-gateway
            - exit-gateway
      - name: semver_compatibility
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: no_legacy
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: epoch_id
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: output
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Output'
      responses:
        '200':
          description: ''
          content:
