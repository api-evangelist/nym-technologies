      - name: no_legacy
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: epoch_id
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: output
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Output'
      responses:
