aid: nym-technologies
name: Nym Technologies
description: >-
  Nym Technologies SA builds Nym, an open-source decentralized privacy
  infrastructure. Its flagship product NymVPN is a decentralized VPN built on the
  Nym mixnet, a multi-layer network of mix nodes that shuffles and delays packets
  to protect metadata (who talks to whom, when, and from where), not just IP
  addresses, using the Sphinx packet format, cover traffic, and zero-knowledge
  ecash (zk-nyms) for anonymous, unlinkable payments. The network is incentivized
  by the NYM token on the Nyx (Cosmos SDK) blockchain. Nym publishes a public Nym
  API (validator / nym-api) and a Node Status API for querying mixnodes, gateways,
  ecash signatures, epochs, rewards and network status, plus Rust and TypeScript
  SDKs (mix-fetch, mix-tunnel, mix-dns, mix-websocket) for routing arbitrary
  traffic through the mixnet.
